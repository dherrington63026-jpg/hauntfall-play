<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#06080b">
<title>Hauntfall</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="hud">
  <div class="left"><div class="lv"><b id="lvl">1</b></div><div class="bars"><div class="hp"><i id="hpFill"></i><span id="hpText"></span></div><div class="xp"><i id="xpFill"></i></div></div></div>
  <div class="mid"><div id="timer">5:00</div><div class="sm">kills <b id="kills">0</b> · gold <b id="gold">0</b> <br>threat <b id="threat">1.0</b></div></div>
  <div class="right"><button id="btnAfk">AFK</button><button id="btnLeave" title="Leave the map">EXIT</button><button id="btnPause">II</button></div>
  <div id="acts"><button id="btnUlt" class="act ult"><i id="ultFill"></i><b>BURST</b></button><button id="btnDash" class="act dash"><i id="dashFill"></i><b>DASH</b></button></div>
  <div id="bossbar"><b>THE GRAVEKEEPER</b><div class="bb"><i id="bossFill"></i></div></div>
</div>
<div id="toasts"></div>
<div id="banner"></div>
<div id="combo"></div>
<div id="contract"></div>
<div id="hint"></div>
<div id="joy"><i></i></div>
<div id="levelup"><h2>LEVEL UP</h2><div class="cards"></div></div>
<div id="pause"><div class="box"><h2>Paused</h2><div class="spdrow"><small>Audio</small><button data-mu="music">Music</button><button data-mu="sound">Sounds</button><button data-mu="autopick">Auto-pick in AFK</button></div><div class="spdrow"><small>Game speed</small><button data-sp="0.6">Slow</button><button data-sp="0.75">Normal</button><button data-sp="1">Fast</button></div><div class="shoprow"><small>Shop</small><button data-shop="removeAds">Remove Ads</button><button data-shop="builders">Builders Pack</button><button data-shop="restore">Restore Purchases</button><p id="shopmsg" class="dim"></p></div><div class="kbrow"><button data-kb="open">Report a problem</button></div><div class="legal"><a href="https://games.kelbrasolutions.net/hauntfall/privacy.html" target="_blank" rel="noopener">Privacy Policy</a> &middot; <a href="https://games.kelbrasolutions.net/hauntfall/support.html" target="_blank" rel="noopener">Support</a></div><button data-pa="resume" class="go">Resume</button><button data-pa="quit">Leave the map<br><small>keep what you collected</small></button></div></div>
<div id="screen"></div>
<div id="loading"><h1>HAUNTFALL</h1><p id="loadMsg">Waking the dead...</p></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
